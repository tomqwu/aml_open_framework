# AML spec for an EU-regulated bank under AMLD6.
# Covers STR filing to national FIU, PEP screening, and EDD triggers.

version: 1

program:
  name: eu_bank_aml
  jurisdiction: EU
  regulator: EBA
  owner: money_laundering_reporting_officer
  effective_date: 2026-01-01

data_contracts:
  - id: txn
    source: raw.transactions
    freshness_sla: 1h
    columns:
      - { name: txn_id,             type: string,    nullable: false }
      - { name: customer_id,        type: string,    nullable: false, pii: true }
      - { name: amount,             type: decimal,   nullable: false, constraints: [">0"] }
      - { name: currency,           type: string,    nullable: false }
      - { name: channel,            type: string,    enum: [cash, wire, sepa, card] }
      - { name: direction,          type: string,    enum: [in, out] }
      - { name: booked_at,          type: timestamp, nullable: false }
      # Round-5 #3 — ISO 20022 ExternalPurpose1Code populated by the
      # iso20022 ingestion adapter (PR #56). NULL on synthetic / CSV
      # data sources that don't supply it; downstream purpose-code
      # rules degrade gracefully when the column is empty.
      - { name: purpose_code,       type: string,    nullable: true }
      # PR-ML-3: Path B counterparty/debtor fields. Declared
      # nullable so existing CSV/synthetic rows missing them still
      # load. Path B (cross-signal amplification) activates when
      # richer pacs.008 ingestion or BYOD data populates these.
      # On the canonical seed-42 dataset they are sparse, so
      # Path B's "all-to-same-known-counterparty" gate stays
      # closed and C0010 fires Path A (the SQL-equivalent baseline)
      # — the python_ref scorer's MRM-surfacing + score-distribution
      # remain valuable even before Path B has firing data.
      #
      # `counterparty_account` is the framework's pacs.008
      # parser's beneficiary identifier (different from
      # `counterparty_id` which is the BYOD/CSV-style id). The
      # scorer COALESCEs counterparty_id ← counterparty_account so
      # both ingestion paths populate Path B's concentration gate
      # (Codex round 5 + 6).
      - { name: counterparty_id,      type: string,    nullable: true }
      - { name: counterparty_account, type: string,    nullable: true }
      - { name: debtor_country,       type: string,    nullable: true }
      - { name: counterparty_country, type: string,  nullable: true }
    quality_checks:
      - { not_null: [txn_id, customer_id, amount, booked_at] }
      - { unique: [txn_id] }

  - id: customer
    source: raw.customers
    freshness_sla: 24h
    columns:
      - { name: customer_id,  type: string, nullable: false, pii: true }
      - { name: full_name,    type: string, nullable: false, pii: true }
      - { name: country,      type: string, nullable: false }
      - { name: risk_rating,  type: string, enum: [low, medium, high] }
      - { name: onboarded_at, type: timestamp, nullable: false }
      - { name: business_activity, type: string, nullable: true }
      - { name: edd_last_review, type: timestamp, nullable: true }
      - { name: pep_status,   type: string, nullable: true }

rules:
  - id: structuring_cash
    name: Cash structuring below EUR 15,000 threshold
    severity: high
    regulation_refs:
      - citation: "AMLD6 Art. 50"
        description: "Suspicious transaction reporting obligation."
      - citation: "Directive 2015/849 Art. 11"
        description: "CDD threshold for cash transactions >= EUR 15,000."
    logic:
      type: aggregation_window
      source: txn
      filter:
        channel: cash
        direction: in
        amount: { between: [8000, 14999] }
      group_by: [customer_id]
      window: 30d
      having:
        count:      { gte: 3 }
        sum_amount: { gte: 30000 }
    escalate_to: l1_analyst
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
    tags: [structuring, cash, amld6]
    business_intent: >
      Detect customers depositing cash in the €8,000–€14,999 just-below-CDD
      band three or more times within 30 days summing to €30,000+ — the
      pattern targeted by AMLD6 Art. 50 STR obligations where depositors
      split transactions to stay under the Art. 11 €15,000 CDD threshold.
    out_of_scope:
      - single cash deposits at or above €15,000 (already trigger CDD requirements directly)
      - cash withdrawals (rule is inbound-only)
      - third-party deposits where the depositor is a different person from the account holder
      - structuring across multiple related-party accounts (requires entity resolution beyond this rule)

  - id: high_risk_jurisdiction
    name: Transactions with EU high-risk third countries
    severity: high
    regulation_refs:
      - citation: "AMLD6 Art. 18a"
        description: "Enhanced due diligence for high-risk third countries."
      - citation: "EU Delegated Regulation 2016/1675"
        description: "List of high-risk third countries."
    logic:
      type: custom_sql
      sql: |
        SELECT
            'high_risk_jurisdiction' AS rule_id,
            t.customer_id,
            COUNT(*) AS count,
            SUM(t.amount) AS sum_amount,
            MIN(t.booked_at) AS window_start,
            MAX(t.booked_at) AS window_end
        FROM txn t
        JOIN customer c ON t.customer_id = c.customer_id
        WHERE c.country IN ('RU', 'IR', 'KP', 'MM', 'SY', 'AF', 'YE')
          AND t.booked_at >= TIMESTAMP '{window_start}'
          AND t.booked_at <  TIMESTAMP '{as_of}'
        GROUP BY t.customer_id
        HAVING SUM(t.amount) >= 5000
        ORDER BY t.customer_id
    escalate_to: l2_investigator
    evidence:
      - all_matching_transactions
      - jurisdiction_risk_assessment
    tags: [high_risk_jurisdiction, edd]
    business_intent: >
      Surface customers domiciled in the EU's high-risk third-country list
      (RU, IR, KP, MM, SY, AF, YE) whose activity exceeds a low €5,000
      aggregate floor — the EDD trigger required by AMLD6 Art. 18a and the
      Delegated Regulation 2016/1675 country list.
    out_of_scope:
      - counterparty-side high-risk geography (the join is on customer.country)
      - customers from jurisdictions outside the hard-coded list even if individually risky
      - sanctioned-name matches against an individual (handled by sanctions_screening)
      - cross-border SEPA flows that don't involve a customer in the high-risk set

  - id: pep_screening
    name: Politically Exposed Person screening
    severity: critical
    regulation_refs:
      - citation: "AMLD6 Art. 20-23"
        description: "Enhanced due diligence for PEPs and their family members."
      - citation: "AMLD6 Art. 3(9)"
        description: "Definition of politically exposed person."
    logic:
      type: custom_sql
      sql: |
        SELECT
            'pep_screening' AS rule_id,
            c.customer_id,
            SUM(t.amount) AS sum_amount,
            COUNT(*) AS count,
            MIN(t.booked_at) AS window_start,
            MAX(t.booked_at) AS window_end
        FROM customer c
        JOIN txn t ON c.customer_id = t.customer_id
        WHERE c.pep_status IS NOT NULL AND c.pep_status != ''
          AND t.booked_at >= TIMESTAMP '{window_start}'
          AND t.booked_at <  TIMESTAMP '{as_of}'
        GROUP BY c.customer_id
        HAVING SUM(t.amount) >= 10000
        ORDER BY c.customer_id
    escalate_to: l2_investigator
    evidence:
      - customer_kyc_profile
      - pep_screening_results
      - source_of_wealth_documentation
    tags: [pep, edd, amld6]
    business_intent: >
      Flag customers carrying a populated pep_status whose transaction
      activity exceeds €10,000 in aggregate. The AMLD6 Art. 20–23 PEP regime
      requires senior-management approval and source-of-wealth establishment
      before transactions are permitted; this rule surfaces the activity
      that should have triggered that EDD path.
    out_of_scope:
      - PEPs with no transaction activity (handled by periodic EDD review, not transaction monitoring)
      - non-PEP customers in the same country as a PEP (PEP status is per-customer)
      - family-member or close-associate PEPs not flagged on pep_status (requires CDD enrichment)
      - sanctioned PEPs (the higher-severity sanctions rule overrides this surface)

  - id: rapid_movement_sepa
    name: Rapid SEPA pass-through within 48h
    severity: medium
    regulation_refs:
      - citation: "AMLD6 Art. 50"
        description: "STR for layering via SEPA transfers."
    logic:
      type: aggregation_window
      source: txn
      filter:
        channel: { in: [sepa, wire] }
      group_by: [customer_id]
      window: 7d
      having:
        sum_amount: { gte: 50000 }
        count: { gte: 4 }
    escalate_to: l1_analyst
    evidence:
      - all_matching_transactions
    tags: [rapid_movement, layering, sepa]
    business_intent: >
      Catch the SEPA pass-through layering signature where four or more
      transactions on the SEPA and wire channels post in a 7-day window
      summing to €50,000+. SEPA's same-day clearing makes the rail a
      natural layering venue once cash-deposit controls tighten.
    out_of_scope:
      - intra-channel velocity (handled by structuring and pep_screening rules)
      - non-SEPA / non-wire pass-through (cash and card channels excluded)
      - cross-channel movement spread over more than seven days
      - travel-rule data-quality issues (covered by travel_rule_completeness)

  - id: sanctions_screening
    name: EU sanctions list screening
    severity: critical
    regulation_refs:
      - citation: "EU Regulation 269/2014"
        description: "Restrictive measures against Russia."
      - citation: "EU Regulation 2580/2001"
        description: "Measures against terrorism financing."
    logic:
      type: list_match
      source: customer
      field: full_name
      list: sanctions
      match: fuzzy
      threshold: 0.8
    escalate_to: l2_investigator
    evidence:
      - customer_kyc_profile
      - sanctions_match_details
    tags: [sanctions, eu_sanctions]
    business_intent: >
      Fuzzy-match every customer's full_name against the consolidated EU
      restrictive-measures list (Regulation 269/2014 Russia plus
      2580/2001 terrorism financing) at threshold 0.8. A hit obligates
      immediate freeze and reporting to the national FIU.
    out_of_scope:
      - counterparty (non-customer) names appearing in inbound wire metadata
      - beneficial-owner / control-person screening (different attribute path)
      - PEP screening (handled by pep_screening with a separate EDD path)
      - matches below threshold 0.8 (require list curation rather than threshold relaxation)

  # --- FATF R.16 TRAVEL-RULE COMPLETENESS ---
  # Round-5 #2 — composes with the iso20022 ingestion adapter (PR #56).
  # Wire transfers ≥ EUR/USD 1,000 crossing borders must carry full
  # originator + beneficiary information (name + account + address-or-id).
  # The python_ref scorer reads the txn table's debtor_*/creditor_*/uetr
  # columns the pacs.008/009 parser writes and emits one alert per
  # offending row with a structured `missing_fields` list.
  - id: travel_rule_completeness
    name: FATF R.16 — cross-border wire missing required fields
    severity: high
    regulation_refs:
      - citation: "FATF R.16 (June 2025 revision)"
        description: "Originator + beneficiary info required on cross-border wires ≥ USD/EUR 1,000."
      - citation: "EU Regulation 2023/1113 (Transfer of Funds)"
        description: "EU implementation of the Travel Rule for funds and crypto."
    logic:
      type: python_ref
      callable: aml_framework.models.travel_rule:validate_travel_rule
      model_id: travel_rule_completeness
      model_version: "fatf_r16_2025-06"
    escalate_to: l2_investigator
    evidence:
      - matching_transaction
      - originator_kyc_record
      - beneficiary_lookup
    tags: [travel_rule, fatf_r16, cross_border]
    business_intent: >
      Validate that every cross-border wire ≥ €1,000 carries the originator
      and beneficiary information FATF R.16 + EU 2023/1113 require (name,
      account, and address-or-identifier on each side). Surfaces specific
      missing fields per offending row so the operator can repair the
      ingestion pipeline rather than guess at the gap.
    out_of_scope:
      - domestic wires below the cross-border travel-rule threshold
      - data already present but failing semantic validation (e.g. clearly bogus addresses)
      - crypto travel rule on virtual-asset rails (handled by VASP specs)
      - counterparty CDD adequacy (this rule only checks message completeness)

  # --- ISO 20022 PURPOSE-CODE TYPOLOGY (Round-5 #3) ---
  # Snippet copied from `spec/library/iso20022_purpose_codes.yaml` —
  # demonstrates a high-risk purpose-code rule reading the purpose_code
  # column the iso20022 ingestion adapter (PR #56) writes. The snippet
  # detects investment-purpose churn (FATF Feb 2026 Cyber-Enabled
  # Fraud calls out INVS as the canonical pig-butchering payout
  # marker). Operators tune count + sum_amount via the tuning_grid.
  - id: invs_velocity_investment_scam
    name: INVS purpose-code velocity — investment-scam indicator
    severity: high
    regulation_refs:
      - citation: "FATF Cyber-Enabled Fraud (Feb 2026)"
        description: "Investment-scam typology — purpose-code INVS misuse."
      - citation: "FinCEN FIN-2023-Alert005"
        description: "Pig-butchering / relationship-investment scams."
    logic:
      type: aggregation_window
      source: txn
      filter:
        direction: out
        purpose_code: INVS
      group_by: [customer_id]
      window: 14d
      having:
        count:      { gte: 3 }
        sum_amount: { gte: 5000 }
    escalate_to: l2_investigator
    evidence:
      - matching_invs_transactions
      - customer_kyc_profile
      - beneficiary_lookup
    tags: [iso20022, purpose_code, invs, pig_butchering, cyber_enabled_fraud]
    business_intent: >
      Flag outbound payments carrying ISO 20022 purpose code INVS
      (investment) — three or more in a 14-day window summing to €5,000+.
      The FATF Cyber-Enabled Fraud paper and FinCEN FIN-2023-Alert005 name
      INVS misuse as a primary pig-butchering payout marker; the velocity
      floor suppresses one-off legitimate brokerage transfers.
    out_of_scope:
      - inbound INVS credits (this rule is direction:out only)
      - investment activity using purpose codes other than INVS (e.g. SECT, DIVI)
      - broker-internal trades that don't traverse the txn contract
      - Path-B cross-signal amplification (covered by investment_scam_scorer with the python_ref logic)
    tuning_grid:
      logic.having.count:      [{gte: 2}, {gte: 3}, {gte: 5}]
      logic.having.sum_amount: [{gte: 2500}, {gte: 5000}, {gte: 10000}]

  # PR-ML-3: investment-scam amplifier (python_ref alongside the
  # SQL aggregation_window above). Same baseline (≥3 outflows
  # summing ≥$5k = Path A "snippet"), PLUS a lower-count cross-
  # signal path (Path B) that catches the early pig-butchering
  # shape: 2 outflows to a single offshore counterparty with
  # foreign-destination dominance ≥80% — the FinCEN
  # FIN-2023-Alert005 + FATF Cyber-Enabled Fraud (Feb 2026)
  # "accelerating offshore single-beneficiary drain" pattern the
  # SQL count-3 floor misses.
  - id: investment_scam_scorer
    name: Investment-scam amplifier (counterparty + foreign-dest + accel)
    severity: high
    regulation_refs:
      - citation: "FATF Cyber-Enabled Fraud (Feb 2026)"
        description: "Investment-scam typology — purpose-code INVS misuse."
      - citation: "FinCEN FIN-2023-Alert005"
        description: "Pig-butchering / relationship-investment scams."
    logic:
      type: python_ref
      callable: aml_framework.models.investment_scam_scorer:investment_scam_scorer
      model_id: investment_scam_v1
      model_version: 2026-05-20
    escalate_to: l2_investigator
    evidence:
      - matching_invs_transactions
      - customer_kyc_profile
      - beneficiary_lookup
      - counterparty_concentration_report
    tags: [iso20022, purpose_code, invs, pig_butchering, ml_governed]
    model_tier: medium
    validation_cadence_months: 18
    business_intent: >
      Investment-scam amplifier that runs alongside the SQL INVS rule
      (invs_velocity_investment_scam). Path A reproduces the SQL baseline
      (≥3 outflows summing ≥ €5k). Path B is a lower-count cross-signal
      route — 2 outflows to a single offshore counterparty with foreign-
      destination dominance ≥80% — to catch the early pig-butchering
      shape the SQL count-3 floor misses.
    out_of_scope:
      - the deterministic Path-A baseline alone (the SQL twin handles that surface)
      - non-INVS purpose codes (the scorer keys on INVS just like the SQL rule)
      - inbound flows (both paths analyse outbound only)
      - explainable-AI feature attribution for individual alerts (consumed via the MRM bundle)

workflow:
  queues:
    - id: l1_analyst
      sla: 24h
      next: [l2_investigator, closed_no_action]
    - id: l2_investigator
      sla: 72h
      next: [str_filing, closed_no_action]
    - id: str_filing
      sla: 30d
      regulator_form: EU_STR
    - id: closed_no_action
      sla: 24h

reporting:
  forms:
    EU_STR:
      template: eu_str_v1
      mandatory_fields: [subject, narrative, triggering_rules, transactions]

retention_policy:
  evidence: 5y
  alerts: 5y
  case_decisions: 5y
  raw_transactions: 5y

metrics:
  - id: alert_volume_total
    name: Total alerts produced
    category: operational
    audience: [director, manager, analyst]
    owner: money_laundering_reporting_officer
    formula:
      type: count
      source: alerts

  - id: typology_coverage
    name: Typology coverage
    category: effectiveness
    audience: [vp, director]
    owner: money_laundering_reporting_officer
    unit: "%"
    formula:
      type: coverage
      universe: typologies
      covered_by: rule_tags
    target: { gte: 0.8 }
    thresholds:
      green: { gte: 0.8 }
      amber: { gte: 0.5 }
      red:   { lt: 0.5 }

  - id: pep_alerts
    name: PEP-related alerts
    category: risk
    audience: [svp, vp, director]
    owner: money_laundering_reporting_officer
    formula:
      type: count
      source: alerts
      filter: { rule_id: { in: [pep_screening] } }

  - id: rules_active_count
    name: Active rules deployed
    category: delivery
    audience: [svp, vp, director, pm]
    owner: money_laundering_reporting_officer
    formula:
      type: count
      source: rules
      filter: { status: active }
    thresholds:
      green: { gte: 4 }
      amber: { gte: 2 }
      red:   { lt: 2 }

reports:
  - id: mlro_quarterly
    title: MLRO quarterly brief
    audience: svp
    cadence: quarterly
    sections:
      - title: Program effectiveness
        metrics: [typology_coverage, pep_alerts]
      - title: Program scale
        metrics: [alert_volume_total, rules_active_count]
