# AML spec for a UK-regulated bank under FCA/MLR 2017.
# Covers SAR filing to NCA (UKFIU), sanctions via OFSI, and PEP screening.

version: 1

program:
  name: uk_bank_aml
  jurisdiction: UK
  regulator: FCA
  owner: money_laundering_reporting_officer
  effective_date: 2026-01-01

data_contracts:
  - id: txn
    source: raw.transactions
    freshness_sla: 1h
    columns:
      - { name: txn_id,      type: string,    nullable: false }
      - { name: customer_id, type: string,    nullable: false, pii: true }
      - { name: amount,      type: decimal,   nullable: false, constraints: [">0"] }
      - { name: currency,    type: string,    nullable: false }
      - { name: channel,     type: string,    enum: [cash, wire, faster_payments, card] }
      - { name: direction,   type: string,    enum: [in, out] }
      - { name: booked_at,   type: timestamp, nullable: false }
    quality_checks:
      - { not_null: [txn_id, customer_id, amount, booked_at] }
      - { unique: [txn_id] }

  - id: customer
    source: raw.customers
    freshness_sla: 24h
    columns:
      - { name: customer_id,  type: string, nullable: false, pii: true }
      - { name: full_name,    type: string, nullable: false, pii: true }
      - { name: country,      type: string, nullable: false }
      - { name: risk_rating,  type: string, enum: [low, medium, high] }
      - { name: onboarded_at, type: timestamp, nullable: false }
      - { name: business_activity, type: string, nullable: true }
      - { name: edd_last_review, type: timestamp, nullable: true }
      - { name: pep_status,   type: string, nullable: true }

  # PR-ML-2: pacs.004 return events. The framework's synthetic
  # generator emits this contract's rows (C0011 "ROAMR LTD"
  # planted with 3 high-risk returns) but no spec consumed them
  # until this PR — "dead ground truth" that PR-ML-2 closes.
  # Mirrors the snippet-library contract shape used by
  # `high_risk_return_burst_mule_probing`.
  - id: txn_return
    source: raw.pacs004_returns
    freshness_sla: 4h
    columns:
      - { name: return_id,               type: string,    nullable: false }
      - { name: original_uetr,           type: string,    nullable: true }
      - { name: original_end_to_end_id,  type: string,    nullable: true }
      - { name: original_tx_id,          type: string,    nullable: true }
      - { name: amount,                  type: decimal,   nullable: false, constraints: [">0"] }
      - { name: currency,                type: string,    nullable: false }
      - { name: returned_at,             type: timestamp, nullable: false }
      - { name: reason_code,             type: string,    nullable: false }
      - { name: reason_info,             type: string,    nullable: true }
      - { name: originator_name,         type: string,    nullable: false, pii: true }
      - { name: originator_country,      type: string,    nullable: true }
      - { name: beneficiary_name,        type: string,    nullable: true, pii: true }
      - { name: beneficiary_country,     type: string,    nullable: true }
      - { name: msg_id,                  type: string,    nullable: true }
      - { name: msg_kind,                type: string,    nullable: true }
    quality_checks:
      - { not_null: [return_id, amount, returned_at, reason_code, originator_name] }
      - { unique: [return_id] }

rules:
  - id: structuring_cash
    name: Cash structuring below GBP 10,000
    severity: high
    regulation_refs:
      - citation: "POCA 2002 s.330"
        description: "Regulated sector SAR obligation."
      - citation: "MLR 2017 reg. 28"
        description: "Customer due diligence measures."
    logic:
      type: aggregation_window
      source: txn
      filter:
        channel: cash
        direction: in
        amount: { between: [5000, 9999] }
      group_by: [customer_id]
      window: 30d
      having:
        count:      { gte: 3 }
        sum_amount: { gte: 20000 }
    escalate_to: l1_analyst
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
    tags: [structuring, cash, poca]
    business_intent: >
      Detect customers depositing cash in the £5,000–£9,999 band three or
      more times within 30 days summing to £20,000+. The pattern is the
      UK analogue of CTR/LCTR structuring — splitting deposits to evade
      the threshold-based reporting trigger and avoid a single reportable
      transaction visible to NCA.
    out_of_scope:
      - single cash deposits at or above £10,000 (already trigger CDD/EDD via reg. 28)
      - cash withdrawals (rule is inbound-only)
      - third-party deposits where the depositor is not the account holder
      - structuring across related-party accounts (requires entity resolution beyond this rule)

  - id: high_risk_jurisdiction
    name: Transactions with FATF high-risk jurisdictions
    severity: high
    regulation_refs:
      - citation: "MLR 2017 reg. 33"
        description: "Enhanced due diligence for high-risk countries."
    logic:
      type: custom_sql
      sql: |
        SELECT
            'high_risk_jurisdiction' AS rule_id,
            t.customer_id,
            COUNT(*) AS count,
            SUM(t.amount) AS sum_amount,
            MIN(t.booked_at) AS window_start,
            MAX(t.booked_at) AS window_end
        FROM txn t
        JOIN customer c ON t.customer_id = c.customer_id
        WHERE c.country IN ('RU', 'IR', 'KP', 'MM', 'SY', 'AF')
          AND t.booked_at >= TIMESTAMP '{window_start}'
          AND t.booked_at <  TIMESTAMP '{as_of}'
        GROUP BY t.customer_id
        HAVING SUM(t.amount) >= 5000
        ORDER BY t.customer_id
    escalate_to: l2_investigator
    evidence:
      - all_matching_transactions
      - jurisdiction_risk_assessment
    tags: [high_risk_jurisdiction, edd]
    business_intent: >
      Surface customers domiciled in FATF call-for-action jurisdictions
      (RU, IR, KP, MM, SY, AF) whose activity exceeds a low £5,000
      aggregate floor. MLR 2017 reg. 33 requires EDD on customers
      established in such jurisdictions; this rule provides the
      transactional trigger that drives the EDD review.
    out_of_scope:
      - counterparty-side high-risk geography (the join is on customer.country)
      - customers from FATF grey-list countries outside the hard-coded set
      - sanctioned-name matches against an individual (handled by sanctions_ofsi)
      - cross-border activity that doesn't involve a customer domiciled in the high-risk set

  - id: sanctions_ofsi
    name: OFSI sanctions screening
    severity: critical
    regulation_refs:
      - citation: "SAMLA 2018"
        description: "Sanctions and Anti-Money Laundering Act 2018."
      - citation: "OFSI Financial Sanctions"
        description: "HM Treasury consolidated list."
    logic:
      type: list_match
      source: customer
      field: full_name
      list: sanctions
      match: fuzzy
      threshold: 0.8
    escalate_to: l2_investigator
    evidence:
      - customer_kyc_profile
      - sanctions_match_details
    tags: [sanctions, ofsi, samla]
    business_intent: >
      Fuzzy-match every customer's full_name against the OFSI consolidated
      list (HM Treasury) at threshold 0.8. A hit obligates immediate
      freeze, OFSI reporting, and NCA SAR filing — these are SAMLA 2018
      compliance gates, not suspicion signals.
    out_of_scope:
      - counterparty (non-customer) names appearing in inbound wire metadata
      - beneficial-owner / control-person screening of corporate customers (different attribute)
      - PEP screening (the UK MLRO handles PEP risk via EDD rather than this list)
      - sanctions screening against transaction narrative or freeform fields

  - id: unusual_volume_spike
    name: Unusual volume spike
    severity: medium
    regulation_refs:
      - citation: "POCA 2002 s.330"
        description: "SAR obligation for suspicious activity."
    logic:
      type: custom_sql
      sql: |
        WITH recent AS (
            SELECT customer_id, SUM(amount) AS recent_total
            FROM txn
            WHERE booked_at >= TIMESTAMP '{recent_start}'
              AND booked_at <  TIMESTAMP '{as_of}'
            GROUP BY customer_id
        ),
        baseline AS (
            SELECT customer_id, SUM(amount) / 4.0 AS weekly_avg
            FROM txn
            WHERE booked_at >= TIMESTAMP '{baseline_start}'
              AND booked_at <  TIMESTAMP '{recent_start}'
            GROUP BY customer_id
            HAVING COUNT(*) >= 2
        )
        SELECT
            'unusual_volume_spike' AS rule_id,
            r.customer_id,
            r.recent_total AS sum_amount,
            b.weekly_avg AS baseline_avg,
            r.recent_total / NULLIF(b.weekly_avg, 0) AS spike_ratio,
            TIMESTAMP '{recent_start}' AS window_start,
            TIMESTAMP '{as_of}' AS window_end
        FROM recent r
        JOIN baseline b ON r.customer_id = b.customer_id
        WHERE r.recent_total > b.weekly_avg * 5
          AND r.recent_total >= 5000
        ORDER BY r.customer_id
    escalate_to: l1_analyst
    evidence:
      - all_matching_transactions
    tags: [unusual_activity, behavioral]
    business_intent: >
      Behavioural baseline rule — flag a customer whose recent-window
      total exceeds five times their own prior weekly average with a
      £5,000 floor. Surfaces activity inconsistent with the customer's
      profile, which underpins the suspicious-activity reporting
      obligation in POCA 2002 s.330.
    out_of_scope:
      - new customers with no baseline (require ≥2 baseline transactions)
      - dormant-then-active patterns where prior activity is zero (different shape)
      - absolute-large transactions that aren't anomalous against the customer's own baseline
      - pacs.004 return-burst signatures (handled by mule_return_burst_scorer)

  # PR-ML-2: mule-return-burst python_ref scorer.
  # Reads the txn_return contract declared above. Goes beyond the
  # `high_risk_return_burst_mule_probing` custom_sql snippet in
  # spec/library by layering count + beneficiary-country fan-out +
  # shell-name density signals. C0011 "ROAMR LTD" (3 returns,
  # AC03/AC04/MD07, all CH-jurisdiction SHELL VEHICLE) is the
  # planted ground-truth positive both paths fire on.
  - id: mule_return_burst_scorer
    name: Mule return-burst (pacs.004 + cross-signal)
    severity: high
    regulation_refs:
      - citation: "POCA 2002 s.330"
        description: "Regulated sector SAR obligation."
      - citation: "FCA FG24/4 — APP fraud detection expectations"
        description: "Return-reason mining for mule signatures."
      - citation: "FATF Cyber-Enabled Fraud (Feb 2026)"
        description: "Money-mule recruitment via probing return-reason patterns."
    logic:
      type: python_ref
      callable: aml_framework.models.mule_return_burst_scorer:mule_return_burst_scorer
      model_id: mule_return_burst_v1
      model_version: 2026-05-20
    escalate_to: l2_investigator
    evidence:
      - matching_return_events
      - originator_kyc_profile
      - beneficiary_lookup
    tags: [mule, pacs004, return_reasons, ml_governed]
    model_tier: medium
    validation_cadence_months: 18
    business_intent: >
      Score originators emitting bursts of pacs.004 returns by combining
      return count, beneficiary-country fan-out, and shell-name density.
      Mule recruiters probe receiving accounts with small returns to
      discover which beneficiary accounts are still alive; this scorer
      surfaces the probe signature before the next victim payment lands.
    out_of_scope:
      - originators with a single return (no burst signal — relies on count ≥ 2)
      - returns on rails other than pacs.004 (e.g. SWIFT MT103 N99 messages)
      - the deterministic high_risk_return_burst custom_sql snippet (the python_ref adds cross-signal lift on the same data)
      - beneficiary-side behavioural analysis (separate inbound mule rules cover that)

workflow:
  queues:
    - id: l1_analyst
      sla: 24h
      next: [l2_investigator, closed_no_action]
    - id: l2_investigator
      sla: 72h
      next: [sar_filing, closed_no_action]
    - id: sar_filing
      sla: 30d
      regulator_form: UK_SAR
    - id: closed_no_action
      sla: 24h

reporting:
  forms:
    UK_SAR:
      template: uk_sar_v1
      mandatory_fields: [subject, narrative, triggering_rules, transactions]

retention_policy:
  evidence: 5y
  alerts: 5y
  case_decisions: 5y
  raw_transactions: 5y

metrics:
  - id: alert_volume_total
    name: Total alerts produced
    category: operational
    audience: [director, manager, analyst]
    owner: money_laundering_reporting_officer
    formula:
      type: count
      source: alerts

  - id: typology_coverage
    name: Typology coverage
    category: effectiveness
    audience: [vp, director]
    owner: money_laundering_reporting_officer
    unit: "%"
    formula:
      type: coverage
      universe: typologies
      covered_by: rule_tags
    target: { gte: 0.8 }
    thresholds:
      green: { gte: 0.8 }
      amber: { gte: 0.5 }
      red:   { lt: 0.5 }

  - id: rules_active_count
    name: Active rules deployed
    category: delivery
    audience: [svp, vp, director, pm]
    owner: money_laundering_reporting_officer
    formula:
      type: count
      source: rules
      filter: { status: active }

  - id: alert_to_sar_rate
    name: Alert-to-SAR conversion rate
    category: regulatory
    audience: [svp, vp, director]
    owner: money_laundering_reporting_officer
    unit: "%"
    formula:
      type: ratio
      numerator:
        type: count
        source: cases
        filter: { status: sar_filing }
      denominator:
        type: count
        source: alerts
    target: { gte: 0.1 }
    thresholds:
      green: { gte: 0.1 }
      amber: { gte: 0.05 }
      red:   { lt: 0.05 }

reports:
  - id: mlro_quarterly
    title: MLRO quarterly brief
    audience: svp
    cadence: quarterly
    sections:
      - title: Program effectiveness
        metrics: [typology_coverage, alert_to_sar_rate]
      - title: Program scale
        metrics: [alert_volume_total, rules_active_count]
