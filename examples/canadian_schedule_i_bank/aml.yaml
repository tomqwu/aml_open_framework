# AML/ATF spec for a Canadian Schedule I bank.
# Modeled on findings from the TD Bank 2024 DOJ/FinCEN enforcement actions
# ($3.09B in combined penalties) to demonstrate how spec-driven controls
# surface the gap patterns that led to that outcome.
#
# Every rule and metric maps to a specific finding in the consent orders.
# See docs/case-studies/td-2024.md for the traceability matrix.

version: 1

program:
  name: schedule_i_bank_aml
  jurisdiction: CA
  regulator: FINTRAC
  owner: chief_anti_money_laundering_officer
  effective_date: 2026-01-01
  # PR-EQ-1 (TM Gap 1): demonstrative `legacy_reference` for the
  # 5-year-lookback parallel-run divergence classifier. Points at
  # a CSV the operator exports from the legacy alert system (path
  # is illustrative — operators replace at deploy time). Engine
  # ignores this at runtime; `engine/equivalence.py` (PR-EQ-2)
  # consumes it.
  legacy_reference:
    path: data/legacy/td_mantas_alerts.csv
    format: csv
    dataset: mantas_v2
    key_columns: [rule_id, customer_id, window_start]
  # N1 governed-augmentation seam: advisory alert triage score. Ranks
  # alerts by SAR-likelihood without ever changing disposition.
  prioritization:
    enabled: true
  # #495: governed advisory suppression. De-prioritizes (NEVER auto-closes)
  # low-score alerts on low-risk customers so investigators reach the urgent
  # tail first. Requires `prioritization` (the score it gates on). Advisory,
  # explainable, reversible, evidenced in `suppression_report.json`.
  # Illustrative — operators tune `deprioritize_below` off their FP analysis.
  risk_segmentation:
    enabled: true
    segments:
      - id: low_risk_retail
        field: customer_risk_rating
        values: [low]
        deprioritize_below: 0.25
        rationale: >
          Low-risk retail customers scoring below the 0.25 advisory threshold
          are worked after the urgent tail. Advisory only — never auto-closed;
          the rule alert stays in the ledger and is investigator-overridable.
        owner: chief_anti_money_laundering_officer
  # #497: governed model-risk monitoring (SR 11-7 / OSFI E-23). Emits a
  # frozen, manifest-pinned `model_risk_report.json` rolling the model
  # inventory + per-rule count drift (current vs prior run) + validation
  # cadence. Advisory/monitoring only — never blocks a run or changes a
  # model; surfaced on the Drift Monitor page. Defaults shown implicitly
  # (drift_high_ratio 2.0, baseline_runs 10).
  model_risk_monitoring:
    enabled: true

# ---------------------------------------------------------------------------
# Data contracts — one per channel to enforce channel-level coverage.
# TD's biggest finding: ~92% of transaction volume was unmonitored because
# entire channels (ACH, cheques) were excluded from the monitoring system.
# Declaring each channel as a contract forces every channel to be visible.
# ---------------------------------------------------------------------------
data_contracts:
  - id: txn
    source: raw.transactions
    freshness_sla: 1h
    columns:
      - { name: txn_id,      type: string,    nullable: false, pii: false }
      - { name: customer_id, type: string,    nullable: false, pii: true  }
      - { name: amount,      type: decimal,   nullable: false, constraints: [">0"] }
      - { name: currency,    type: string,    nullable: false }
      - { name: channel,     type: string,    enum: [cash, wire, ach, e_transfer, cheque, card, rtp, crypto, prepaid] }
      - { name: direction,   type: string,    enum: [in, out] }
      - { name: booked_at,   type: timestamp, nullable: false }
    quality_checks:
      - { not_null: [txn_id, customer_id, amount, booked_at] }
      - { unique:   [txn_id] }

  - id: customer
    source: raw.customers
    freshness_sla: 24h
    columns:
      - { name: customer_id,      type: string,    nullable: false, pii: true }
      - { name: full_name,        type: string,    nullable: false, pii: true }
      - { name: country,          type: string,    nullable: false }
      - { name: risk_rating,      type: string,    enum: [low, medium, high] }
      - { name: onboarded_at,     type: timestamp, nullable: false }
      - { name: business_activity, type: string,   nullable: true }
      - { name: edd_last_review,  type: timestamp, nullable: true }

# ---------------------------------------------------------------------------
# Detection rules — each maps to a TD Bank failure mode
# ---------------------------------------------------------------------------
rules:
  # --- STRUCTURING: cash below LCTR $10k CAD threshold ---
  - id: structuring_cash_deposits
    name: Cash structuring — deposits below LCTR $10,000 threshold
    severity: high
    regulation_refs:
      - citation: "PCMLTFA s.11.1"
        description: "Structuring offence — splitting transactions to avoid reporting."
      - citation: "PCMLTFR s.7(1)"
        description: "LCTR filing obligation for cash transactions of $10,000+ CAD."
    logic:
      type: aggregation_window
      source: txn
      filter:
        channel: cash
        direction: in
        amount: { between: [5000, 9999] }
      group_by: [customer_id]
      window: 30d
      having:
        count:      { gte: 3 }
        sum_amount: { gte: 20000 }
    escalate_to: l1_aml_analyst
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
      - prior_alerts_90d
    tags: [structuring, cash, lctr]
    # Sweep grid for `aml tune --rule structuring_cash_deposits`. Pairs
    # of count + sum_amount thresholds an MLRO might consider before
    # changing production thresholds. The tuner shows alert-count
    # delta vs the production setting (count≥3, sum_amount≥20000).
    tuning_grid:
      logic.having.count:      [{gte: 2}, {gte: 3}, {gte: 4}, {gte: 5}]
      logic.having.sum_amount: [{gte: 15000}, {gte: 20000}, {gte: 30000}]
    business_intent: >
      Detect customers depositing cash in the $5,000–$9,999 just-below-LCTR
      band three or more times within 30 days summing to $20,000+ — the
      canonical TD-finding structuring pattern of splitting cash deposits to
      stay below the $10,000 CAD LCTR filing trigger.
    out_of_scope:
      - single cash deposits at or above the $10,000 LCTR threshold (handled by large_cash_lctr)
      - prepaid-load structuring below the $3,000 reporting floor (handled by prepaid_load_structuring)
      - cash withdrawals (this rule is inbound-only)
      - third-party deposits where a non-customer brings cash to an account holder's account

  # --- RAPID PASS-THROUGH: cash-in then e-transfer-out within 48h ---
  # TD failure: pass-through typology across $470M+ was undetected.
  - id: rapid_pass_through
    name: Rapid pass-through — cash-in followed by e-transfer-out within 48h
    severity: critical
    regulation_refs:
      - citation: "PCMLTFA s.7"
        description: "STR obligation — pass-through pattern indicative of layering."
      - citation: "FINTRAC Operational Alert 2016-01"
        description: "Rapid movement of funds through Canadian financial system."
    logic:
      type: custom_sql
      sql: |
        WITH cash_in AS (
            SELECT customer_id, txn_id, amount, booked_at
            FROM txn
            WHERE channel = 'cash' AND direction = 'in'
              AND booked_at >= TIMESTAMP '{window_start}'
              AND booked_at <  TIMESTAMP '{as_of}'
        ),
        etransfer_out AS (
            SELECT customer_id, txn_id, amount, booked_at
            FROM txn
            WHERE channel = 'e_transfer' AND direction = 'out'
              AND booked_at >= TIMESTAMP '{window_start}'
              AND booked_at <  TIMESTAMP '{as_of}'
        ),
        paired AS (
            SELECT
                ci.customer_id,
                SUM(ci.amount) AS cash_in_total,
                SUM(eo.amount) AS etransfer_out_total,
                COUNT(DISTINCT ci.txn_id) AS cash_in_count,
                COUNT(DISTINCT eo.txn_id) AS etransfer_out_count,
                MIN(ci.booked_at) AS window_start,
                MAX(eo.booked_at) AS window_end
            FROM cash_in ci
            JOIN etransfer_out eo
              ON ci.customer_id = eo.customer_id
              AND eo.booked_at BETWEEN ci.booked_at AND ci.booked_at + INTERVAL '48' HOUR
            GROUP BY ci.customer_id
        )
        SELECT
            'rapid_pass_through' AS rule_id,
            customer_id,
            cash_in_total + etransfer_out_total AS sum_amount,
            cash_in_count + etransfer_out_count AS count,
            window_start,
            window_end
        FROM paired
        WHERE cash_in_total + etransfer_out_total >= 30000
        ORDER BY customer_id
    escalate_to: l2_investigator
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
      - counterparty_analysis
      - prior_alerts_90d
    tags: [pass_through, layering, e_transfer, td_finding]
    business_intent: >
      Detect the TD-finding pass-through signature where cash-in legs are
      followed by e-transfer-out legs to the same customer within 48 hours
      and the combined value reaches $30,000+ — the layering pattern that
      went undetected across $470M+ at TD because the channel pair was
      excluded from monitoring.
    out_of_scope:
      - cash-in followed by cash-out within 48 hours (different layering shape, not a pass-through to e-transfer)
      - e-transfer pass-through where the funding leg is wire/ACH (covered by passthrough_funnel_scorer)
      - aggregations beyond 48 hours (handled by 7-day or 30-day rules)
      - crypto off-ramping (covered by crypto_vasp_rapid_passthrough)

  # --- PASS-THROUGH FUNNEL (procedural python_ref, PR-ML-1) ------------
  # Channel-agnostic IN→OUT funnel detector. Sits alongside the
  # channel-specific `rapid_pass_through` rule above so the cash→
  # e_transfer-shaped TD finding stays a first-class signal AND broader
  # any-channel pass-through patterns get caught too (cash→wire,
  # wire→ach, etc. — anywhere drain channel differs from funding
  # channel). Closes R1b: the `custom_sql` route hit five Codex
  # windowing edge cases (benign top-up after drain, multi-anchor
  # double-count, phase-boundary attribution mis-assignment); the
  # procedural python_ref expresses the "first out-event marks the
  # phase boundary" formulation in straight Python where each edge
  # case is a unit test.
  - id: passthrough_funnel_scorer
    name: Pass-through funnel (procedural, cross-channel)
    severity: critical
    regulation_refs:
      - citation: "PCMLTFA s.7"
        description: "STR obligation — pass-through pattern indicative of layering."
      - citation: "FINTRAC Operational Alert 2016-01"
        description: "Rapid movement of funds through Canadian financial system."
    logic:
      type: python_ref
      callable: aml_framework.models.passthrough_scorer:passthrough_funnel_scorer
      model_id: passthrough_funnel_v1
      model_version: 2026-05-20
    escalate_to: l2_investigator
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
      - counterparty_analysis
      - prior_alerts_90d
    tags: [pass_through, layering, funnel, ml_governed]
    model_tier: medium
    validation_cadence_months: 18
    business_intent: >
      Channel-agnostic pass-through funnel scorer that complements the
      channel-specific rapid_pass_through rule — flags any in→out pattern
      where the drain channel differs from the funding channel (cash→wire,
      wire→ach, ach→e_transfer, etc.) with a first-out-event phase boundary
      so it doesn't double-count benign top-ups after the drain.
    out_of_scope:
      - same-channel velocity (intra-channel bursts handled by structuring and burst rules)
      - the specific cash→e_transfer 48h shape captured by rapid_pass_through
      - patterns spanning multiple customers (no joint-account or related-party fan-in)
      - genuine refunds or settlement reversals tied to a known counterparty

  # --- CRYPTO VASP RAPID PASS-THROUGH: cash-in then crypto-out within 48h ---
  # Digital-asset off-ramp layering — funds enter as cash and leave the
  # bank as a virtual-asset transfer to a VASP within two days.
  - id: crypto_vasp_rapid_passthrough
    name: Crypto VASP rapid pass-through — cash-in followed by crypto-out within 48h
    severity: critical
    regulation_refs:
      - citation: "PCMLTFA s.7"
        description: "STR obligation — pass-through pattern indicative of layering."
      - citation: "PCMLTFR s.7(1)"
        description: "Reporting obligations for dealers in virtual currency (VASP)."
      - citation: "FINTRAC LVCTR (Large Virtual Currency Transaction Report)"
        description: "Laundering of proceeds through virtual currency and VASPs."
    logic:
      type: custom_sql
      sql: |
        WITH cash_in AS (
            SELECT customer_id, txn_id, amount, booked_at
            FROM txn
            WHERE channel = 'cash' AND direction = 'in'
              AND booked_at >= TIMESTAMP '{window_start}'
              AND booked_at <  TIMESTAMP '{as_of}'
        ),
        crypto_out AS (
            SELECT customer_id, txn_id, amount, booked_at
            FROM txn
            WHERE channel = 'crypto' AND direction = 'out'
              AND booked_at >= TIMESTAMP '{window_start}'
              AND booked_at <  TIMESTAMP '{as_of}'
        ),
        paired AS (
            SELECT
                ci.customer_id,
                SUM(co.amount) AS crypto_out_total,
                SUM(ci.amount) AS cash_in_total,
                COUNT(DISTINCT ci.txn_id) AS cash_in_count,
                COUNT(DISTINCT co.txn_id) AS crypto_out_count,
                MIN(ci.booked_at) AS window_start,
                MAX(co.booked_at) AS window_end
            FROM cash_in ci
            JOIN crypto_out co
              ON ci.customer_id = co.customer_id
              AND co.booked_at BETWEEN ci.booked_at AND ci.booked_at + INTERVAL '48' HOUR
            GROUP BY ci.customer_id
        )
        SELECT
            'crypto_vasp_rapid_passthrough' AS rule_id,
            customer_id,
            cash_in_total + crypto_out_total AS sum_amount,
            cash_in_count + crypto_out_count AS count,
            window_start,
            window_end
        FROM paired
        WHERE cash_in_total >= 30000 AND crypto_out_total >= 30000
        ORDER BY customer_id
    escalate_to: l2_investigator
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
      - counterparty_analysis
      - prior_alerts_90d
    tags: [pass_through, layering, crypto, vasp]
    business_intent: >
      Detect the cash-to-crypto off-ramping pattern where fiat enters as
      cash and exits as a virtual-asset transfer to a VASP within 48 hours,
      both legs reaching $30,000+. Captures the layering shape that
      precipitated FINTRAC's introduction of the LVCTR regime.
    out_of_scope:
      - crypto-to-fiat (inbound) flows — this rule monitors fiat-to-crypto only
      - on-chain stablecoin layering between hosted wallets (no fiat leg)
      - cash-to-e_transfer pass-through (covered by rapid_pass_through)
      - large single crypto withdrawals that aren't paired with a cash funding leg

  # --- RTP INSTANT-PAYMENT BURST: rapid same-customer real-time sends ---
  # Real-time-rail abuse — many small instant payments fired in a tight
  # window to move value before manual review can intervene.
  - id: rtp_instant_payment_burst
    name: RTP instant-payment burst — rapid real-time sends within a short window
    severity: high
    regulation_refs:
      - citation: "PCMLTFA s.7"
        description: "STR obligation — rapid layering inconsistent with client profile."
      - citation: "PCMLTFR s.123.1"
        description: "Ongoing monitoring of business relationships."
    logic:
      type: aggregation_window
      source: txn
      filter:
        channel: rtp
        direction: out
      group_by: [customer_id]
      window: 1d
      having:
        count:      { gte: 6 }
        sum_amount: { gte: 5000 }
    escalate_to: l1_aml_analyst
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
      - prior_alerts_90d
    tags: [rtp, velocity, instant_payment]
    # Sweep grid for `aml tune --rule rtp_instant_payment_burst`. Pairs
    # of count + sum_amount thresholds an MLRO might consider before
    # changing production thresholds (count≥6, sum_amount≥5000).
    tuning_grid:
      logic.having.count:      [{gte: 4}, {gte: 6}, {gte: 8}, {gte: 10}]
      logic.having.sum_amount: [{gte: 3000}, {gte: 5000}, {gte: 10000}]
    business_intent: >
      Flag customers firing six or more outbound RTP/instant payments inside
      a single day summing to $5,000+ — the real-time rail's irrevocability
      means bursts must be caught while the case is still actionable, not
      retrospectively. Velocity is the core signal because individual
      amounts can be small but the aggregate moves quickly.
    out_of_scope:
      - inbound RTP credit bursts (covered by separate mule-receiver rules in fraud specs)
      - non-RTP channels (e-transfer/wire velocity is handled by other rules)
      - bursts spread over multiple days
      - high-value single RTP sends that don't form a burst

  # --- PREPAID-LOAD STRUCTURING: stored-value loads below reporting floor ---
  # Stored-value structuring — repeated prepaid loads kept just under the
  # $3,000 CAD reporting threshold to evade aggregation.
  - id: prepaid_load_structuring
    name: Prepaid-load structuring — loads below the $3,000 reporting threshold
    severity: high
    regulation_refs:
      - citation: "PCMLTFA s.11.1"
        description: "Structuring offence — splitting transactions to avoid reporting."
      - citation: "PCMLTFR s.7(1)"
        description: "Reporting obligations for prepaid payment product loads."
    logic:
      type: aggregation_window
      source: txn
      filter:
        channel: prepaid
        direction: in
        amount: { between: [1000, 2999] }
      group_by: [customer_id]
      window: 30d
      having:
        count:      { gte: 5 }
        sum_amount: { gte: 14000 }
    escalate_to: l1_aml_analyst
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
      - prior_alerts_90d
    tags: [structuring, prepaid, stored_value]
    # Sweep grid for `aml tune --rule prepaid_load_structuring`. Pairs
    # of count + sum_amount thresholds an MLRO might consider before
    # changing production thresholds (count≥5, sum_amount≥14000).
    tuning_grid:
      logic.having.count:      [{gte: 4}, {gte: 5}, {gte: 6}, {gte: 8}]
      logic.having.sum_amount: [{gte: 10000}, {gte: 14000}, {gte: 20000}]
    business_intent: >
      Detect repeated prepaid-card loads in the $1,000–$2,999 band — five or
      more per 30 days summing to $14,000+ — kept just under the $3,000 CAD
      prepaid reporting threshold. Stored-value rails are a known evasion
      route once large-cash and structuring rules tighten on bank accounts.
    out_of_scope:
      - cash structuring on deposit accounts (covered by structuring_cash_deposits)
      - prepaid loads at or above $3,000 (caught by the standard reporting trigger)
      - prepaid card spend or redemption (the rule is load-side only)
      - prepaid cards issued to corporate cardholders for payroll/expense use

  # --- SHELL COMPANY INDICATORS ---
  # TD failure: shell companies with no declared business opened accounts.
  - id: shell_company_indicators
    name: Shell company — no business activity with high-volume multi-jurisdiction wires
    severity: high
    regulation_refs:
      - citation: "PCMLTFA s.7"
        description: "STR obligation — shell company indicators."
      - citation: "PCMLTFR s.138"
        description: "Beneficial ownership verification requirements."
      - citation: "OSFI Guideline B-8 s.4"
        description: "Enhanced due diligence for higher-risk entities."
    logic:
      type: custom_sql
      sql: |
        WITH wire_activity AS (
            SELECT
                t.customer_id,
                COUNT(*) AS wire_count,
                SUM(t.amount) AS wire_total,
                MIN(t.booked_at) AS window_start,
                MAX(t.booked_at) AS window_end
            FROM txn t
            WHERE t.channel = 'wire' AND t.direction = 'in'
              AND t.booked_at >= TIMESTAMP '{window_start}'
              AND t.booked_at <  TIMESTAMP '{as_of}'
            GROUP BY t.customer_id
            HAVING COUNT(*) >= 10
        )
        SELECT
            'shell_company_indicators' AS rule_id,
            w.customer_id,
            w.wire_total AS sum_amount,
            w.wire_count AS count,
            w.window_start,
            w.window_end
        FROM wire_activity w
        JOIN customer c ON w.customer_id = c.customer_id
        WHERE (c.business_activity IS NULL OR c.business_activity = '')
        ORDER BY w.customer_id
    escalate_to: l2_investigator
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
      - beneficial_ownership_records
      - jurisdiction_analysis
    tags: [shell_company, layering, beneficial_ownership]
    business_intent: >
      Catch customers booked as entities but missing a declared
      business_activity field who nonetheless receive ten or more incoming
      wires inside the window. TD's enforcement specifically called out
      shell-company onboarding gaps — the absence of a stated business
      purpose combined with high wire volume is itself the suspicion.
    out_of_scope:
      - retail individual customers (the rule targets the entity/business population via business_activity)
      - shell customers active on cash/e_transfer rather than wires
      - shells with a populated but bogus business_activity string (requires NLP/EDD, not this control)
      - low-wire-count shells (the ≥10 floor avoids one-off vendor receipts)

  # --- HIGH-RISK JURISDICTION ---
  - id: high_risk_jurisdiction
    name: Significant activity from FATF high-risk jurisdiction
    severity: high
    regulation_refs:
      - citation: "PCMLTFA s.9.4"
        description: "Correspondent banking and high-risk country due diligence."
      - citation: "FINTRAC Guideline 8A"
        description: "Risk assessment — geographic risk factors."
    logic:
      type: custom_sql
      sql: |
        SELECT
            'high_risk_jurisdiction' AS rule_id,
            t.customer_id,
            COUNT(*) AS count,
            SUM(t.amount) AS sum_amount,
            MIN(t.booked_at) AS window_start,
            MAX(t.booked_at) AS window_end
        FROM txn t
        JOIN customer c ON t.customer_id = c.customer_id
        WHERE c.country IN ('RU', 'IR', 'KP', 'MM', 'SY')
          AND t.booked_at >= TIMESTAMP '{window_start}'
          AND t.booked_at <  TIMESTAMP '{as_of}'
        GROUP BY t.customer_id
        HAVING SUM(t.amount) >= 5000
        ORDER BY t.customer_id
    escalate_to: l2_investigator
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
      - jurisdiction_risk_assessment
    tags: [high_risk_jurisdiction, geographic_risk]
    business_intent: >
      Surface customers domiciled in FATF call-for-action or sanctioned
      jurisdictions (RU, IR, KP, MM, SY) whose transaction activity exceeds a
      low $5,000 aggregate floor — geographic risk under PCMLTFA s.9.4 drives
      EDD obligations and this rule provides the trigger.
    out_of_scope:
      - counterparty-side high-risk geography (the join is on customer.country, not counterparty country)
      - sanctioned-name matches against an individual (handled by sanctions_screening)
      - customers in FATF grey-list jurisdictions outside the hard-coded set
      - trade-finance flows to high-risk countries (handled separately in TBML specs)

  # --- LARGE CASH (LCTR) ---
  - id: large_cash_lctr
    name: Cash activity exceeding LCTR threshold ($10,000 CAD/day)
    severity: medium
    regulation_refs:
      - citation: "PCMLTFR s.7(1)"
        description: "LCTR filing obligation for cash transactions of $10,000+ CAD."
      - citation: "PCMLTFR s.132"
        description: "24-hour aggregation rule for cash transactions."
    logic:
      type: aggregation_window
      source: txn
      filter:
        channel: cash
      group_by: [customer_id]
      window: 1d
      having:
        sum_amount: { gte: 10000 }
    escalate_to: l1_aml_analyst
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
    tags: [lctr, cash, regulatory_reporting]
    business_intent: >
      Provide the regulator-facing trigger for any single-day cash aggregate
      at or above $10,000 CAD per customer per PCMLTFR s.7(1) and the
      24-hour aggregation rule. This rule produces the LCTR filing surface
      itself rather than a suspicion signal, so it routes to L1 for ordinary
      reporting rather than to investigations.
    out_of_scope:
      - sub-threshold structuring (handled by structuring_cash_deposits)
      - cash aggregated across windows longer than one calendar day
      - non-cash channels even when individually above $10,000 (different reporting form)

  # --- UNUSUAL VOLUME SPIKE ---
  - id: unusual_volume_spike
    name: Unusual volume spike — recent activity far exceeds baseline
    severity: medium
    regulation_refs:
      - citation: "PCMLTFA s.7"
        description: "STR obligation — transactions inconsistent with client profile."
      - citation: "PCMLTFR s.123.1"
        description: "Ongoing monitoring of business relationships."
    logic:
      type: custom_sql
      sql: |
        WITH recent AS (
            SELECT customer_id, SUM(amount) AS recent_total
            FROM txn
            WHERE booked_at >= TIMESTAMP '{recent_start}'
              AND booked_at <  TIMESTAMP '{as_of}'
            GROUP BY customer_id
        ),
        baseline AS (
            SELECT customer_id, SUM(amount) / 4.0 AS weekly_avg
            FROM txn
            WHERE booked_at >= TIMESTAMP '{baseline_start}'
              AND booked_at <  TIMESTAMP '{recent_start}'
            GROUP BY customer_id
            HAVING COUNT(*) >= 2
        )
        SELECT
            'unusual_volume_spike' AS rule_id,
            r.customer_id,
            r.recent_total AS sum_amount,
            b.weekly_avg AS baseline_avg,
            r.recent_total / NULLIF(b.weekly_avg, 0) AS spike_ratio,
            TIMESTAMP '{recent_start}' AS window_start,
            TIMESTAMP '{as_of}' AS window_end
        FROM recent r
        JOIN baseline b ON r.customer_id = b.customer_id
        WHERE r.recent_total > b.weekly_avg * 5
          AND r.recent_total >= 5000
        ORDER BY r.customer_id
    escalate_to: l1_aml_analyst
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
      - historical_transaction_profile
    tags: [unusual_activity, behavioral]
    business_intent: >
      Behavioural baseline rule — flag a customer whose recent-window volume
      exceeds five times their own prior weekly average (with a $5,000 floor
      so noise on dormant low-volume accounts doesn't dominate). Surfaces
      activity inconsistent with the customer's profile per PCMLTFR s.123.1.
    out_of_scope:
      - first-month onboarded customers with no baseline (require ≥2 baseline transactions)
      - dormant-then-active patterns where prior activity is zero (covered by dormant_account_activity)
      - absolute-large transactions that aren't anomalous against the customer's own baseline

  # --- DORMANT ACCOUNT REACTIVATION ---
  - id: dormant_account_activity
    name: Dormant account reactivation with large transaction
    severity: high
    regulation_refs:
      - citation: "PCMLTFA s.7"
        description: "STR obligation — dormant accounts with sudden large transactions."
      - citation: "FINTRAC ML/TF Indicators"
        description: "Dormant account suddenly reactivated with significant activity."
    logic:
      type: custom_sql
      sql: |
        WITH last_activity AS (
            SELECT customer_id, MAX(booked_at) AS last_txn_date
            FROM txn
            WHERE booked_at < TIMESTAMP '{dormant_cutoff}'
            GROUP BY customer_id
        ),
        recent_large AS (
            SELECT customer_id, SUM(amount) AS sum_amount,
                   COUNT(*) AS count,
                   MIN(booked_at) AS window_start,
                   MAX(booked_at) AS window_end
            FROM txn
            WHERE booked_at >= TIMESTAMP '{dormant_cutoff}'
              AND booked_at <  TIMESTAMP '{as_of}'
              AND amount >= 10000
            GROUP BY customer_id
        )
        SELECT
            'dormant_account_activity' AS rule_id,
            r.customer_id,
            r.sum_amount,
            r.count,
            r.window_start,
            r.window_end
        FROM recent_large r
        JOIN last_activity la ON r.customer_id = la.customer_id
        ORDER BY r.customer_id
    escalate_to: l2_investigator
    evidence:
      - all_matching_transactions
      - customer_kyc_profile
      - account_activity_history
    tags: [dormant_account, behavioral]
    business_intent: >
      Detect accounts inactive prior to the dormant cutoff that suddenly book
      transactions of $10,000+ inside the post-cutoff window. A dormant
      account coming alive with large transfers is a textbook nominee/shell
      indicator and was a contributing pattern in the TD enforcement.
    out_of_scope:
      - continuously active accounts whose new transaction is large but not preceded by dormancy
      - small reactivation activity below the $10,000 individual-transaction floor
      - new customers (no prior history means no dormancy concept)
      - dormancy ending with structured small transactions (covered by structuring_cash_deposits)

  # --- SANCTIONS SCREENING ---
  # Screen customer names against consolidated sanctions lists (SEMA, OFAC SDN).
  - id: sanctions_screening
    name: Sanctions list screening — SEMA and OFAC SDN
    severity: critical
    regulation_refs:
      - citation: "Criminal Code s.83.08"
        description: "Offence to deal with property of listed persons (terrorist financing)."
      - citation: "SEMA s.4"
        description: "Special Economic Measures Act — prohibition on dealings with listed persons."
      - citation: "PCMLTFA s.7.1"
        description: "Terrorist Property Report — file without delay upon discovery."
    logic:
      type: list_match
      source: customer
      field: full_name
      list: sanctions
      match: fuzzy
      threshold: 0.8
    escalate_to: l2_investigator
    evidence:
      - customer_kyc_profile
      - sanctions_match_details
      - beneficial_ownership_records
    tags: [sanctions, terrorist_financing, sema]
    business_intent: >
      Fuzzy-match every customer's full_name against the consolidated SEMA
      and OFAC SDN lists at threshold 0.8. A hit obligates immediate
      Terrorist Property Report filing under PCMLTFA s.7.1 and triggers
      relationship freeze under Criminal Code s.83.08 / SEMA s.4.
    out_of_scope:
      - counterparty (non-customer) names appearing in inbound wire metadata
      - beneficial-owner / control-person screening of corporate customers (different attribute path)
      - wallet-address sanctions screening (covered by VASP-specific specs)
      - politically exposed person screening, which is risk-based not list-based

  # --- ADVERSE MEDIA SCREENING ---
  - id: adverse_media_screening
    name: Adverse media screening
    severity: medium
    regulation_refs:
      - citation: "PCMLTFR s.123.1"
        description: "Ongoing monitoring — adverse media as risk indicator."
      - citation: "OSFI Guideline B-8 s.3"
        description: "Automated monitoring including adverse media sources."
    logic:
      type: list_match
      source: customer
      field: full_name
      list: adverse_media
      match: fuzzy
      threshold: 0.8
    escalate_to: l1_aml_analyst
    evidence:
      - customer_kyc_profile
      - adverse_media_articles
    tags: [adverse_media, ongoing_monitoring]
    business_intent: >
      Fuzzy-match every customer's full_name against the curated
      adverse-media watchlist (financial-crime reporting, regulatory
      enforcement, ongoing investigations) at threshold 0.8. Adverse media
      is an explicit risk indicator under OSFI Guideline B-8 and supports
      the PCMLTFR s.123.1 ongoing-monitoring obligation.
    out_of_scope:
      - sanctions-list matches (handled by sanctions_screening with a higher-severity path)
      - one-off social-media mentions that aren't in the curated adverse-media corpus
      - reputational risk on counterparties (the join is against customer names)
      - PEP status that doesn't carry an adverse-media reference

  # --- ML-DRIVEN BEHAVIORAL RISK SCORING ---
  # Demonstrates the python_ref execution pipeline. The callable is a
  # heuristic scorer (velocity, amount deviation, channel mixing) that
  # returns customers with a composite risk score above threshold.
  - id: ml_risk_scorer
    name: ML-driven behavioral risk scoring
    severity: medium
    regulation_refs:
      - citation: "OSFI Guideline E-23"
        description: "Model risk management — models must be inventoried, validated, and monitored."
      - citation: "PCMLTFR s.123.1"
        description: "Ongoing monitoring using risk-based analytical tools."
    logic:
      type: python_ref
      callable: "aml_framework.models.scoring:heuristic_risk_scorer"
      model_id: heuristic_risk_v1
      model_version: "1.0.0"
    escalate_to: l1_aml_analyst
    evidence:
      - customer_transaction_profile
      - model_score_breakdown
      - historical_alert_history
    tags: [behavioral, ml_scoring]
    business_intent: >
      Heuristic model combining velocity, amount-deviation, and channel-mixing
      signals into a composite risk score. Returns customers above the
      decision threshold for L1 review — supplements the deterministic
      typology rules with a behavioural-anomaly axis while staying within
      OSFI E-23 model-risk governance (inventoried, validated, monitored).
    out_of_scope:
      - replacing the deterministic typology rules — this is an additive
        behavioural signal, not a substitute for structuring/LCTR controls
      - explainable-AI feature attribution for individual alerts (consumed via the MRM bundle)
      - new-customer behavioural scoring (the model is calibrated on populations with usage history)

# ---------------------------------------------------------------------------
# Workflow — queues reflecting FINTRAC expectations
# ---------------------------------------------------------------------------
workflow:
  queues:
    - id: l1_aml_analyst
      sla: 24h
      next: [l2_investigator, closed_no_action]
    - id: l2_investigator
      sla: 72h
      next: [str_filing, edd_review, closed_no_action]
    - id: str_filing
      sla: 30d
      regulator_form: FINTRAC_STR
    - id: edd_review
      sla: 72h
      next: [l2_investigator, closed_no_action]
    - id: closed_no_action
      sla: 24h

reporting:
  forms:
    FINTRAC_STR:
      template: fintrac_str_v1
      mandatory_fields: [subject, narrative, triggering_rules, transactions]
    FINTRAC_LCTR:
      template: fintrac_lctr_v1
      trigger:
        channel: cash
        aggregate_day: { gte: 10000 }
    FINTRAC_EFTR:
      template: fintrac_eftr_v1
      trigger:
        channel: { in: [wire, e_transfer] }
        direction: out
        cross_border: true
        amount: { gte: 10000 }

retention_policy:
  evidence: 5y
  alerts: 5y
  case_decisions: 5y
  raw_transactions: 5y
  client_identification: 5y

# ---------------------------------------------------------------------------
# Metrics — including TD-specific gap indicators
# ---------------------------------------------------------------------------
metrics:
  # --- Channel coverage gap (TD's biggest finding) ---
  - id: channel_coverage_gap
    name: Channel monitoring coverage
    description: >
      Ratio of channels with at least one active detection rule to total
      declared channels. TD Bank left ~92% of volume unmonitored because
      entire channels were excluded. This metric turns RED if any declared
      channel lacks a rule.
    category: effectiveness
    audience: [svp, vp, director]
    owner: chief_anti_money_laundering_officer
    unit: "%"
    formula:
      type: coverage
      universe: typologies
      covered_by: rule_tags
    target: { eq: 1.0 }
    thresholds:
      green: { eq: 1.0 }
      amber: { gte: 0.8 }
      red:   { lt: 0.8 }

  # --- Internal-alert-ignored proxy ---
  - id: internal_alert_ignored
    name: Repeat-alert rate (closed then re-alerted within 90d)
    description: >
      Proxy for TD's failure mode where front-line concerns went nowhere.
      Counts cases closed_no_action where the same customer triggers a new
      alert. High rate signals inadequate investigation at first review.
    category: effectiveness
    audience: [vp, director, auditor]
    owner: chief_anti_money_laundering_officer
    unit: "%"
    formula:
      type: sql
      sql: >
        SELECT repeat_closed / NULLIF(total_closed, 0)
        FROM (
          SELECT COUNT(*) FILTER (WHERE repeat_flag) AS repeat_closed,
                 COUNT(*) AS total_closed
          FROM closed_cases
        )
    target: { lte: 0.02 }
    thresholds:
      green: { lte: 0.02 }
      amber: { lte: 0.05 }
      red:   { gt: 0.05 }

  - id: alert_volume_total
    name: Total alerts produced
    category: operational
    audience: [director, manager, analyst, developer]
    owner: head_of_financial_crime_ops
    formula:
      type: count
      source: alerts
    thresholds:
      green: { lte: 100 }
      amber: { between: [101, 500] }
      red:   { gt: 500 }

  - id: high_severity_alert_ratio
    name: High/critical severity alert share
    category: risk
    audience: [svp, vp, director]
    owner: chief_anti_money_laundering_officer
    unit: "%"
    formula:
      type: ratio
      numerator:
        type: count
        source: alerts
        filter: { rule_id: { in: [structuring_cash_deposits, rapid_pass_through, passthrough_funnel_scorer, shell_company_indicators, high_risk_jurisdiction, dormant_account_activity] } }
      denominator:
        type: count
        source: alerts
    target: { lte: 0.7 }
    thresholds:
      green: { lte: 0.5 }
      amber: { lte: 0.7 }
      red:   { gt: 0.7 }

  - id: typology_coverage
    name: Typology coverage — rules that fired / all tagged rules
    category: effectiveness
    audience: [vp, director, manager]
    owner: chief_anti_money_laundering_officer
    unit: "%"
    formula:
      type: coverage
      universe: typologies
      covered_by: rule_tags
    target: { gte: 0.8 }
    thresholds:
      green: { gte: 0.8 }
      amber: { gte: 0.5 }
      red:   { lt: 0.5 }

  - id: cases_opened
    name: Cases opened this run
    category: operational
    audience: [manager, analyst, developer]
    owner: head_of_financial_crime_ops
    formula:
      type: count
      source: cases

  - id: cases_routed_to_l1
    name: Cases routed to L1 AML analyst queue
    category: operational
    audience: [manager]
    owner: l1_team_lead
    formula:
      type: count
      source: cases
      filter: { queue: l1_aml_analyst }

  - id: distinct_customers_alerted
    name: Distinct customers alerted
    category: risk
    audience: [vp, director, business]
    owner: chief_anti_money_laundering_officer
    formula:
      type: count
      source: alerts
      distinct_by: customer_id

  - id: transaction_volume_cad
    name: Total transaction volume screened (CAD)
    category: operational
    audience: [director, manager, business, developer]
    owner: data_platform_lead
    unit: CAD
    formula:
      type: sum
      source: txn
      field: amount

  - id: rules_active_count
    name: Total active rules deployed
    category: delivery
    audience: [svp, vp, director, pm, developer]
    owner: aml_program_manager
    formula:
      type: count
      source: rules
      filter: { status: active }
    thresholds:
      green: { gte: 6 }
      amber: { gte: 4 }
      red:   { lt: 4 }

  - id: high_severity_rules_active
    name: Active high/critical severity rules
    category: delivery
    audience: [pm, developer, vp]
    owner: aml_program_manager
    formula:
      type: count
      source: rules
      # `high` + `critical` together — the metric name already
      # promises both. Pre-PR-ML-1 the filter was `severity: high`
      # which contradicted the name; PR-ML-1's
      # passthrough_funnel_scorer (severity:critical) made the
      # undercount user-visible (Codex P2 round 6 catch).
      filter: { severity: { in: [high, critical] }, status: active }
    thresholds:
      green: { gte: 3 }
      amber: { gte: 2 }
      red:   { lt: 2 }

  - id: alert_to_str_rate
    name: Alert-to-STR conversion rate
    category: regulatory
    audience: [svp, vp, director]
    owner: chief_anti_money_laundering_officer
    unit: "%"
    formula:
      type: ratio
      numerator:
        type: count
        source: cases
        filter: { status: str_filing }
      denominator:
        type: count
        source: alerts
    target: { gte: 0.1 }
    thresholds:
      green: { gte: 0.1 }
      amber: { gte: 0.05 }
      red:   { lt: 0.05 }

  - id: sla_compliance_rate
    name: SLA compliance rate
    category: operational
    audience: [manager, director, vp]
    owner: head_of_financial_crime_ops
    unit: "%"
    formula:
      type: sql
      sql: "SELECT CAST(on_time AS FLOAT) / NULLIF(total, 0) FROM ..."
    target: { gte: 0.95 }
    thresholds:
      green: { gte: 0.95 }
      amber: { gte: 0.85 }
      red:   { lt: 0.85 }

  - id: str_filing_latency_p95
    name: STR filing latency (p95, days)
    description: >
      95th-percentile days from alert to STR filing. PCMLTFR requires
      filing within 30 calendar days of detection.
    category: regulatory
    audience: [svp, vp, director, auditor]
    owner: chief_anti_money_laundering_officer
    unit: days
    formula:
      type: sql
      sql: "SELECT PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY filing_days) FROM ..."
    target: { lte: 30 }
    thresholds:
      green: { lte: 15 }
      amber: { lte: 30 }
      red:   { gt: 30 }

  - id: lctr_completeness
    name: LCTR completeness — cash >= $10k reported
    description: >
      Ratio of reportable cash transactions that have a corresponding LCTR.
      TD under-filed because monitoring excluded entire channels.
    category: regulatory
    audience: [vp, director, auditor]
    owner: chief_anti_money_laundering_officer
    unit: "%"
    formula:
      type: sql
      sql: "SELECT filed / NULLIF(reportable, 0) FROM ..."
    target: { eq: 1.0 }
    thresholds:
      green: { eq: 1.0 }
      amber: { gte: 0.95 }
      red:   { lt: 0.95 }

  - id: edd_review_adherence
    name: EDD review cadence adherence
    description: >
      Percentage of high-risk customers whose EDD review is current (within
      12 months). TD failed CDD/EDD on shell companies and nominees.
    category: risk
    audience: [vp, director, auditor]
    owner: chief_anti_money_laundering_officer
    unit: "%"
    formula:
      type: sql
      sql: "SELECT current_edd / NULLIF(high_risk_total, 0) FROM ..."
    target: { gte: 0.95 }
    thresholds:
      green: { gte: 0.95 }
      amber: { gte: 0.80 }
      red:   { lt: 0.80 }

# ---------------------------------------------------------------------------
# Reports — one per audience
# ---------------------------------------------------------------------------
reports:
  - id: cao_quarterly
    title: Chief AML Officer quarterly brief
    audience: svp
    cadence: quarterly
    sections:
      - title: Program effectiveness
        metrics: [channel_coverage_gap, typology_coverage, high_severity_alert_ratio]
        commentary: >
          Channel coverage must be 100% — the TD enforcement showed that
          excluding channels from monitoring is an existential regulatory risk.
      - title: Regulatory posture
        metrics: [alert_to_str_rate, str_filing_latency_p95, lctr_completeness]
      - title: Program scale
        metrics: [rules_active_count, transaction_volume_cad]

  - id: mlro_monthly
    title: MLRO monthly compliance review
    audience: vp
    cadence: monthly
    sections:
      - title: Detection effectiveness
        metrics: [typology_coverage, channel_coverage_gap, high_severity_alert_ratio]
      - title: Escalation health
        metrics: [alert_to_str_rate, internal_alert_ignored]
        commentary: >
          Repeat-alert rate tracks the TD failure mode where closed cases
          re-surfaced. A rising rate signals insufficient first-pass investigation.
      - title: Regulatory filing
        metrics: [str_filing_latency_p95, lctr_completeness, edd_review_adherence]
      - title: Volume
        metrics: [alert_volume_total, distinct_customers_alerted]
      - title: Catalogue
        metrics: [high_severity_rules_active, rules_active_count]

  - id: fintrac_readiness
    title: FINTRAC / OSFI exam readiness
    audience: director
    cadence: monthly
    sections:
      - title: Coverage controls
        metrics: [channel_coverage_gap, typology_coverage]
      - title: Operational demand
        metrics: [alert_volume_total, cases_opened, distinct_customers_alerted]
      - title: Regulatory compliance
        metrics: [str_filing_latency_p95, lctr_completeness, edd_review_adherence]
      - title: Escalation integrity
        metrics: [internal_alert_ignored, sla_compliance_rate]

  - id: ops_daily
    title: Operations daily pulse
    audience: manager
    cadence: daily
    sections:
      - title: Queue load
        metrics: [cases_opened, cases_routed_to_l1, alert_volume_total]
      - title: Performance
        metrics: [sla_compliance_rate]
      - title: Volume
        metrics: [transaction_volume_cad]

  - id: osfi_exam_prep
    title: OSFI examination evidence package
    audience: auditor
    cadence: on_demand
    sections:
      - title: Program coverage
        metrics: [channel_coverage_gap, typology_coverage, rules_active_count]
      - title: Regulatory filing compliance
        metrics: [str_filing_latency_p95, lctr_completeness, edd_review_adherence]
      - title: Escalation integrity
        metrics: [internal_alert_ignored, alert_to_str_rate]
      - title: Risk exposure
        metrics: [high_severity_alert_ratio, distinct_customers_alerted]
