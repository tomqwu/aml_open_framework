name: docs-deploy

# Builds the MkDocs Material site from this repo's `docs/` and pushes
# the rendered `site/` into the docs repo at `main:/` (root). The
# MkDocs landing replaces the old standalone deck `index.html`; the
# deck content lives on as preserved subdirectories (business/,
# technical/, v1-archive/) reached from the MkDocs landing's cards.
# The merged `/research/` keeps both the old visual HTML decks AND
# the markdown-rendered MkDocs research pages — names don't collide
# (data-problem.html vs 2026-05-aml-data-problem/index.html).
#
# Triggers:
#   - push to main when any of: mkdocs.yml | docs/** | this workflow
#   - manual workflow_dispatch (force-rebuild on demand)
#
# Cross-repo push uses DOCS_REPO_PAT — a Personal Access Token with
# `Contents: write` scope on tomqwu/aml_open_framework_docs. Stored
# as a repo secret on this repo.

on:
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs + theme
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build static site
        run: mkdocs build

      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          repository: tomqwu/aml_open_framework_docs
          token: ${{ secrets.DOCS_REPO_PAT }}
          path: docs-site-repo
          ref: main
          fetch-depth: 1

      - name: Sync site/ into docs-site-repo root (preserve deck folders)
        run: |
          # PRESERVE these directories — they are the existing deck
          # content (board / business / technical / v1 archive) and
          # are NOT generated by MkDocs. The MkDocs landing's "Pick
          # your door" cards link to them.
          # PRESERVE these files: README.md, .nojekyll
          # OVERWRITE: index.html (MkDocs landing replaces old deck
          #            standalone index — the deck is still reachable
          #            via /business/, /technical/), 404.html, sitemap.xml
          # MERGE: research/ (old visual HTML decks coexist with new
          #        MkDocs markdown-rendered subdirs — different names,
          #        no collision)
          # PURGE: docs/ — the first-pass deploy lived under /docs/;
          #        we're now at root so wipe the stale subtree.
          rm -rf docs-site-repo/docs
          # Generated names from MkDocs build that we want to refresh
          # cleanly (drop stale files between deploys):
          for d in api-reference architecture audit-evidence dashboard-tour deployment getting-started jurisdictions legacy-import metrics-framework personas progress regulator-mapping assets; do
            rm -rf "docs-site-repo/$d"
          done
          # Copy rendered site/* into docs repo root (overlays into
          # /research/ where the existing HTML decks live unchanged).
          cp -R site/. docs-site-repo/
          # Belt-and-suspenders against Jekyll processing.
          touch docs-site-repo/.nojekyll

      - name: Commit + push to docs repo
        run: |
          cd docs-site-repo
          git config user.name "aml-open-framework-bot"
          git config user.email "bot@aml-open-framework.local"
          git add docs
          if git diff --staged --quiet; then
            echo "No doc changes to publish."
            exit 0
          fi
          # Source-commit reference so the docs repo's history points
          # back at the commit that produced this build.
          git commit -m "docs(site): rebuild from tomqwu/aml_open_framework@${{ github.sha }}"
          git push origin main
