name: docs-deploy

# Builds the MkDocs Material site from this repo's `docs/` and pushes
# the rendered `site/` into the docs repo at `main:/` (root). The
# MkDocs landing replaces the old standalone deck `index.html`; the
# deck content lives on as preserved subdirectories (business/,
# technical/, v1-archive/) reached from the MkDocs landing's cards.
# The merged `/research/` keeps both the old visual HTML decks AND
# the markdown-rendered MkDocs research pages — names don't collide
# (data-problem.html vs 2026-05-aml-data-problem/index.html).
#
# Triggers:
#   - push to main when any of: mkdocs.yml | docs/** | this workflow
#   - manual workflow_dispatch (force-rebuild on demand)
#
# Cross-repo push uses DOCS_REPO_PAT — a Personal Access Token with
# `Contents: write` scope on tomqwu/aml_open_framework_docs. Stored
# as a repo secret on this repo.

on:
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      # Custom theme overrides land here (R32 follow-up — PR #447).
      # MkDocs treats `overrides/` as part of the source via
      # `theme.custom_dir`, so changes here MUST trigger a rebuild.
      - "overrides/**"
      - ".github/workflows/docs-deploy.yml"
    # Codex P2 round 3 — the header release chip reads the latest
    # `v*` annotated tag. Push of a new release tag without touching
    # any of the path-filtered branches above would leave the chip
    # stale until the next docs edit. Tag pushes re-trigger the build
    # so the chip stays in lockstep with releases.
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          # Always build from `main`'s tip, regardless of trigger. The
          # workflow runs on either a path-filtered push to main OR an
          # annotated `v*` tag push. Tag pushes default the checkout to
          # the tag ref, which could be older than main and would
          # publish stale docs — explicit `ref: main` forces fresh tip
          # for both trigger paths. `git describe --match 'v*'` from
          # main HEAD still resolves the latest reachable release tag
          # for the header chip. Codex P2 rounds 4-5.
          ref: main
          # Need full history + tags so `git describe` resolves the
          # latest annotated `v*` tag for the header chip (shallow
          # clones drop tag refs).
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs + theme
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Extract release info for header chip
        run: |
          # Mirrors the dashboard topbar: latest annotated release tag
          # + its first-line summary surfaced next to the wordmark so a
          # reader can see "which build of the docs am I looking at?"
          # at a glance. mkdocs.yml reads these via `!ENV` substitution.
          #
          # Codex P2 round 2 — `git describe --tags` picks up ANY tag
          # (incl. lightweight `temp` / `wip` etc.), so a non-release
          # tag closer than the last `vN.N.N` would silently get
          # published in the chip. `--match 'v*'` + dropping `--tags`
          # restricts to annotated tags matching the release prefix.
          TAG=$(git describe --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [ -n "$TAG" ]; then
            SUMMARY=$(git tag -l --format='%(contents:subject)' "$TAG")
          else
            SUMMARY=""
          fi
          echo "AML_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "AML_RELEASE_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"
          echo "Header chip: tag=$TAG summary='$SUMMARY'"

      - name: Build static site
        run: mkdocs build

      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          repository: tomqwu/aml_open_framework_docs
          token: ${{ secrets.DOCS_REPO_PAT }}
          path: docs-site-repo
          ref: main
          fetch-depth: 1

      - name: Sync site/ into docs-site-repo root (preserve deck folders)
        run: |
          # PRESERVE these directories — they are the existing deck
          # content (board / business / technical / v1 archive) and
          # are NOT generated by MkDocs. The MkDocs landing's "Pick
          # your door" cards link to them.
          # PRESERVE these files: README.md, .nojekyll
          # OVERWRITE: index.html (MkDocs landing replaces old deck
          #            standalone index — the deck is still reachable
          #            via /business/, /technical/), 404.html, sitemap.xml
          # MERGE: research/ (old visual HTML decks coexist with new
          #        MkDocs markdown-rendered subdirs — different names,
          #        no collision)
          # PURGE: docs/ — the first-pass deploy lived under /docs/;
          #        we're now at root so wipe the stale subtree.
          rm -rf docs-site-repo/docs
          # Generated names from MkDocs build that we want to refresh
          # cleanly (drop stale files between deploys):
          for d in api-reference architecture audit-evidence dashboard-tour deployment getting-started jurisdictions legacy-import metrics-framework personas progress regulator-mapping assets; do
            rm -rf "docs-site-repo/$d"
          done
          # Copy rendered site/* into docs repo root (overlays into
          # /research/ where the existing HTML decks live unchanged).
          cp -R site/. docs-site-repo/
          # Belt-and-suspenders against Jekyll processing.
          touch docs-site-repo/.nojekyll

      - name: Commit + push to docs repo
        run: |
          cd docs-site-repo
          git config user.name "aml-open-framework-bot"
          git config user.email "bot@aml-open-framework.local"
          # Pre-PR-442 the site lived under /docs/ and `git add docs`
          # was correct; post-#442 the rendered site is at REPO ROOT
          # (alongside the preserved deck subdirs). Use `git add -A`
          # so EVERY change — including deletions of the now-removed
          # /docs/ subtree — is staged.
          git add -A
          if git diff --staged --quiet; then
            echo "No doc changes to publish."
            exit 0
          fi
          # Source-commit reference so the docs repo's history points
          # back at the commit that produced this build.
          git commit -m "docs(site): rebuild from tomqwu/aml_open_framework@${{ github.sha }}"
          git push origin main
