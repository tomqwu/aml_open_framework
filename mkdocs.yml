site_name: AML Open Framework
site_description: An anti-money-laundering program you can show to your regulator without a six-week reconstruction.
site_url: https://tomqwu.github.io/aml_open_framework_docs/
repo_url: https://github.com/tomqwu/aml_open_framework
repo_name: tomqwu/aml_open_framework
edit_uri: edit/main/docs/

# Site lives at /docs/ on the docs repo (root / is the demo deck).
site_dir: site
docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer           # next/prev page links
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy           # copy button on every code block
    - content.code.annotate
    - content.action.edit         # "edit this page" pencil
    - content.action.view         # "view source" eye
    - content.tabs.link
    - toc.follow
  palette:
    # Brand colours are applied via docs/stylesheets/brand.css —
    # Material's primary/accent here only set the high-level scheme
    # (which dial-set the background ramp); the actual hex values
    # come from brand.css overrides on the `default` / `slate`
    # CSS schemes. Keeping primary/accent set to "black" so Material
    # doesn't ship its own indigo gradient that fights our overrides.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    # Matches the existing board deck: Inter for sans, JetBrains Mono
    # for code. Editorial italic accents (e.g. <em> inside h1) come
    # from Source Serif 4, loaded via the stylesheet @import.
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - stylesheets/brand.css

# Source Serif 4 (used for editorial <em> accents inside headings)
# is fetched at runtime from Google Fonts via @import in brand.css.

nav:
  - Home: index.md

  # ─── Learn ─────────────────────────────────────────────────
  # Tutorial track for a brand-new user. Hold-your-hand pacing,
  # one task per page. Currently a single file — TODO R32: split
  # into 3 paced lessons (install / first run / first rule).
  - Learn:
      - getting-started.md

  # ─── Build ─────────────────────────────────────────────────
  # Task-oriented how-to recipes. Each one assumes the reader
  # has done Getting Started and now needs to "do a thing."
  # Round 31 ships 3 detailed + 5 placeholders; future rounds
  # fill the placeholders.
  - Build:
      - how-to/index.md
      - "Add a detection rule": how-to/add-a-rule.md
      - "Wire a python_ref scorer": how-to/python-ref-scorer.md
      - "Verify the audit chain": how-to/verify-audit-chain.md
      - "Migrate from legacy stack": legacy-import.md
      - "Promote a rule across environments": how-to/promote-rule.md
      - "Export per-case / per-batch evidence": how-to/export-case-pack.md
      - "Walk the lineage chain": how-to/walk-lineage.md
      - "Configure SLA monitoring": how-to/configure-sla.md
      - "Triage defects": how-to/triage-defects.md

  # ─── Operate ───────────────────────────────────────────────
  # Day-2 — running the framework in real environments.
  - Operate:
      - deployment.md
      - dashboard-tour.md
      - audit-evidence.md
      - regulator-mapping.md
      - jurisdictions.md

  # ─── Explain ───────────────────────────────────────────────
  # Why-it-is-this-way content. Architecture, design rationale,
  # research whitepapers, the round-by-round journal.
  - Explain:
      - architecture.md
      - personas.md
      - "Research whitepapers":
          - research/2026-05-aml-data-problem.md
          - research/2026-05-regulator-pulse.md
          - research/2026-04-aml-process-pain.md
          - research/2026-04-fintech-aml-reality.md
          - research/2026-04-competitive-positioning.md
          - research/2026-04-regulator-pulse.md
      - "Progress journal":
          - progress.md
          - five-year-lookback.md

  # ─── Browse ────────────────────────────────────────────────
  # Look-up reference. Not read top-to-bottom.
  - Browse:
      - "Spec reference": spec-reference.md
      - "API reference": api-reference.md
      - "Metrics framework": metrics-framework.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tomqwu/aml_open_framework
  generator: false
